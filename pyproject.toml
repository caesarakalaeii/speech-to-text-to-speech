[project]
name = "voicemask"
version = "2.0.0"
description = "Real-time voice masking: your speech in, a different voice out. Fully local."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

# The entire runtime is ONNX Runtime + numpy. No PyTorch, no CUDA, no system
# packages -- that is what makes a one-click Windows install possible on an
# AMD GPU. See docs/adr/0002-onnx-runtime-only.md.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",           # resampling between device rate and model rate
    "sounddevice>=0.5.1",    # PortAudio bindings, ships its own DLL on Windows
    "onnx-asr[hub]>=0.12",   # Parakeet/Whisper ONNX + Silero VAD, no torch
    "kokoro-onnx>=0.4.7",    # Kokoro-82M TTS
    "onnxruntime>=1.18.1,!=1.24.1,!=1.26.0",
]

[project.optional-dependencies]
# Opt-in AMD/Intel/NVIDIA GPU acceleration on Windows via DirectML.
# Installing this replaces the `onnxruntime` wheel -- use Enable-GPU.bat,
# which also benchmarks it and reverts if it is not actually faster.
directml = ["onnxruntime-directml>=1.18.1"]

# The fast, lower-quality fallback synthesiser (ADR 4). Voices download on
# first use, so this only adds the code path, not the models.
piper = ["piper-tts>=1.3.0"]

[project.scripts]
voicemask = "voicemask.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicemask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: test needs the downloaded ONNX models (skipped if absent)",
    "audio: test needs a real audio device (skipped in CI)",
]
timeout = 600
